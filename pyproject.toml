[tool.black]
skip-string-normalization = true

[tool.mypy]
# Check the typed facade strictly. The existing dynamic protocol internals are
# separately inspectable with `mypy ja3requests`; they are not silently ignored.
python_version = "3.9"
files = ["ja3requests/_typing.py", "ja3requests/__init__.py", "ja3requests/retry.py"]
strict = true
follow_imports = "silent"
show_error_codes = true
pretty = false

[tool.pylint]
disable = [
    "invalid-name",
    "arguments-differ",
    "no-name-in-module",
    "too-many-arguments",
    "too-few-public-methods",
    "too-many-public-methods",
    "too-many-instance-attributes",
    "attribute-defined-outside-init",
    "duplicate-code",
    "fixme",
#    "too-many-return-statements",
#    "broad-exception-caught",
#    "no-member",
#    "wrong-import-order",
#    "consider-using-f-string",
]
#argument-rgx = "[a-z0-9]+(_[a-z]+)*"
#attr-rgx = "_?_?[a-z0-9]+(_[a-z]+)*_?_?"
#variable-rgx = "_?_?[a-z0-9]+(_[a-z]+)*_?_?"
max-line-length = 240
#ignore = "test"
#min-similarity-lines = 20
