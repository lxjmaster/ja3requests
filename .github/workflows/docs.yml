name: Documentation

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            docs/requirements.txt
      - name: Install project and documentation dependencies
        run: python -m pip install -e . -r docs/requirements.txt
      - name: Build documentation strictly
        run: python -m mkdocs build --strict
      - name: Verify links, API objects and local examples
        run: python docs/verify.py
