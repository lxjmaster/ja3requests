name: Public typing

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-consumer:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-typing.txt
      - name: Install runtime, type and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-typing.txt build
      - name: Check the typed facade
        run: python -m mypy
      - name: Build source distribution and wheel from it
        run: python -m build --outdir "$RUNNER_TEMP/typed-dist"
      - name: Install the wheel in an independent environment
        run: |
          python -m venv "$RUNNER_TEMP/typed-wheel"
          "$RUNNER_TEMP/typed-wheel/bin/python" -m pip install "$RUNNER_TEMP"/typed-dist/ja3requests-*.whl
      - name: Check valid consumers and expected errors outside the repository
        run: python typecheck/check.py --python "$RUNNER_TEMP/typed-wheel/bin/python"
